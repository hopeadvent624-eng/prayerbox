[build]
  command = "npm run build"
  publish = "dist"

# Set VITE_API_BASE_URL in Netlify Environment Variables when your API is deployed elsewhere.
# Example: https://your-api-host.com
# The frontend will then make requests to `${VITE_API_BASE_URL}/api/*`.

# If you want Netlify to proxy /api requests to an external host instead,
# set your backend host in the redirect block below.

[[redirects]]
  from = "/api/*"
  to = "https://prayerbox-api.onrender.com/api/:splat"
  status = 200
  force = true
